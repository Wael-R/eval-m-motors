<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, ${vehicle.brand} + ' ' + ${vehicle.model}, _)}">
<main>
	<div id="carousel" class="carousel slide" data-bs-touch="false">
		<div class="carousel-inner">
			<div class="carousel-item" th:each="thumb, iter : ${vehicle.thumbs}" th:classappend="${iter.first} ? 'active'">
				<img th:srcset="${thumb.path}" src="/missing.png" class="d-block w-100 object-fit-contain" style="aspect-ratio: 4/3;">
			</div>
			<div class="carousel-item active" th:if="${#lists.size(vehicle.thumbs) <= 0}">
				<img src="/missing.png" class="d-block w-100 object-fit-contain" style="aspect-ratio: 4/3;">
			</div>
		</div>
		<button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
			<span class="carousel-control-prev-icon" aria-hidden="true"></span>
			<span class="visually-hidden">Image précédente</span>
		</button>
		<button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
			<span class="carousel-control-next-icon" aria-hidden="true"></span>
			<span class="visually-hidden">Image suivante</span>
		</button>
	</div>

	<div class="row my-3">
		<div class="col-8 col-md-5">
			<h3 class="my-0">[[${vehicle.brand} + ' ' + ${vehicle.model}]]</h3>
		</div>
		<div class="col-4 col-md-2 text-end text-md-center align-content-center">
			<span class="fw-semibold">[[${vehicle.price}]]€</span>
		</div>
		<div class="col-12 mt-2 mt-md-0 col-md-5">
			<a th:href="'/private/order/' + ${vehicle.id}" class="w-100 h-100 btn btn-success">Acheter</a>
		</div>
	</div>

	<p th:text="${vehicle.description}" style="white-space: pre-wrap;"></p>
</main>
</html>
