<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, '')}">
<main>
	<div class="align-content-center">
		<form>
			<div class="mb-3">
				<label for="inputEmail" class="form-label">Adresse e-mail</label>
				<input type="email" class="form-control" id="inputEmail" required>
			</div>
			<div class="mb-3 row">
				<div class="col-6">
					<label for="inputLastName" class="form-label">Nom</label>
					<input type="text" class="form-control" id="inputLastName" required>
				</div>
				<div class="col-6">
					<label for="inputFirstName" class="form-label">Prénom</label>
					<input type="text" class="form-control" id="inputFirstName" required>
				</div>
			</div>
			<div class="mb-3">
				<label for="inputPass" class="form-label">Mot de passe</label>
				<input type="password" class="form-control" id="inputPass" required>
			</div>
			<div class="mb-3">
				<label for="inputPass" class="form-label">Confirmer le mot de passe</label>
				<input type="password" class="form-control" id="inputPassConfirm" required>
			</div>
			<button type="submit" class="btn btn-success">Inscription</button>
			<div class="mb-1 mt-3 p-2 alert alert-warning d-none" id="signupError" role="alert"></div>
		</form>
	</div>
	<script>
		$("form").on("submit", (ev) => {
			ev.preventDefault();

			const pass = $("#inputPass").val();

			if(pass != $("#inputPassConfirm").val())
			{
				$("#signupError").removeClass("d-none").text("Les mots de passe ne correspondent pas");
				return;
			}

			xhr("/api/signup", "POST", {
					email: $("#inputEmail").val(),
					password: pass,
					firstName: $("#inputFirstName").val(),
					lastName: $("#inputLastName").val(),
				}, null,
				onSuccess = (req) => {
					location.assign("/login");
				},
				onError = (req, json) => {
					$("#signupError").removeClass("d-none").text(json?.message ?? req.responseText);
				}
			);
		});
	</script>
</main>
</html>
