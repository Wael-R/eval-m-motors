<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, '', _)}">
<main>
	<div class="align-content-center">
		<form>
			<div class="mb-3">
				<label for="inputEmail" class="form-label">Adresse e-mail</label>
				<input type="email" class="form-control" id="inputEmail" required>
			</div>
			<div class="mb-3">
				<label for="inputPass" class="form-label">Mot de passe</label>
				<input type="password" class="form-control" id="inputPass" required>
			</div>
			<button type="submit" class="btn btn-success">Connexion</button>
			<div class="mb-1 mt-3 p-2 alert alert-warning d-none" id="loginError" role="alert"></div>
		</form>
	</div>
	<script>
		$("form").on("submit", (ev) => {
			ev.preventDefault();

			xhr("/api/login", "POST", {
					username: $("#inputEmail").val(),
					password: $("#inputPass").val(),
				}, null,
				onSuccess = (req) => {
					const redirect = new URLSearchParams(location.search).get("redirect");

					if(redirect)
						location.replace(redirect);
					else
						location.replace("/");
				},
				onError = (req, json) => {
					$("#loginError").removeClass("d-none").text(json?.message ?? req.responseText);
				}
			);
		});
	</script>
</main>
</html>
