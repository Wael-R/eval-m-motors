<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, '')}">
<main>
	<div class="align-content-center">
		<form>
			<div class="mb-3">
				<label for="inputEmail" class="form-label">Adresse e-mail</label>
				<input type="email" class="form-control" id="inputEmail">
			</div>
			<div class="mb-3">
				<label for="inputPass" class="form-label">Mot de passe</label>
				<input type="password" class="form-control" id="inputPass">
			</div>
			<button type="submit" class="btn btn-success">Connexion</button>
		</form>
	</div>
	<script>
		$("form").on("submit", (ev) => {
			ev.preventDefault();

			const body = {
				email: $("#inputEmail").val(),
				password: $("#inputPass").val(),
			};

			fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
			.then(async (res) => {
				if(!res.ok)
					console.error(await res.json());
				else
					return res.text();
			})
			.then((res) => {
				console.log(res);
			});
		})
	</script>
</main>
</html>
