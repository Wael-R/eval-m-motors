<!DOCTYPE html>
<html lang="fr" th:fragment="layout(content, subtitle, script)" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-4.0.0.slim.min.js" integrity="sha384-tcspKDb5tWvyRCOWzevlAeQgHeEzYdUHJpcgnIhcP9w4CnfD7DLAcS+k9QzLbRJO" crossorigin="anonymous"></script>
	<script src="/common.js"></script>
	<link href="/styles.css" rel="stylesheet">
	<meta name="csrf" th:content="${_csrf.token}">
	<meta name="csrf_head" th:content="${_csrf.headerName}">

	<title>M-Motors[[${subtitle} != '' ? | - ${subtitle}|]]</title>
</head>
<body>
	<div th:replace="~{comps/nav}"></div>
	<div class="container-lg">
		<div th:replace="${content}"></div>
		<div th:replace="~{comps/footer}"></div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script th:if="${script}" th:replace="${script}"></script>
</body>
</html>
