<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, 'Administrateur')}">
<main>
	<h2>Modification d'un véhicule</h2>

	<form>
		<div class="mb-3 row">
			<div class="col-3">
				<label for="inputBrand" class="form-label">Marque</label>
				<input type="text" class="form-control" id="inputBrand" required>
			</div>
			<div class="col-7">
				<label for="inputModel" class="form-label">Modèle</label>
				<input type="text" class="form-control" id="inputModel" required>
			</div>
			<div class="col-2">
				<label for="inputAvailable" class="form-label">Disponibilité</label>
				<input type="number" class="form-control" id="inputAvailable" value="1" required>
			</div>
		</div>
		<div class="mb-3">
			<label for="inputDesc" class="form-label">Description</label>
			<textarea class="form-control" id="inputDesc"></textarea>
		</div>
		<button type="submit" class="btn btn-success" id="submit" disabled>Sauvegarder</button>
		<div class="mb-1 mt-3 p-2 alert alert-warning d-none" id="error" role="alert"></div>
	</form>

	<script>
		const btn = $("#submit");
		let ready = false;

		jsonRequest("/api/vehicles/details/[[${vehicleId}]]", "GET", null, 
			(res) => {
				ready = true;
				btn.removeAttr("disabled");

				$("#inputBrand").val(res.data.brand);
				$("#inputModel").val(res.data.model);
				$("#inputDesc").val(res.data.description);
				$("#inputAvailable").val(res.data.availability);
			},
			(err) => {
				$("#error").removeClass("d-none").text(err.message);
			}
		);

		$("form").on("submit", (ev) => {
			ev.preventDefault();

			if(!ready)
				return;

			jsonRequest("/api/admin/edit-vehicle", "POST", {
					id: "[[${vehicleId}]]",
					brand: $("#inputBrand").val(),
					model: $("#inputModel").val(),
					description: $("#inputDesc").val(),
					availability: $("#inputAvailable").val(),
				},
				(res) => {
					location.assign("/admin/");
				},
				(err) => {
					$("#error").removeClass("d-none").text(err.message);
				}
			);
		});
	</script>
</main>
</html>
