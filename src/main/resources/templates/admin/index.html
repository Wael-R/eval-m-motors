<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, 'Administrateur')}">
<main>
	<h2>Espace Administrateur</h2>

	<h4>Véhicules</h4>

	<div>
		<div th:each="vehicle : ${vehicles}" class="row">
			<div class="col-1" th:text="${vehicle.id}"></div>
			<div class="col-3" th:text="${vehicle.brand}"></div>
			<div class="col-7" th:text="${vehicle.model}"></div>
			<div class="col-1"><a th:href="'/admin/edit-vehicle/' + ${vehicle.id}" class="btn btn-sm btn-success">Modifier</a></div>
		</div>
	</div>

	<!-- TODO: vehicle search -->
	<!-- TODO: vehicle list cards -->
	<!-- TODO: pages -->

	<a href="/admin/add-vehicle" class="btn btn-success">Nouveau véhicule</a>
</main>
</html>
