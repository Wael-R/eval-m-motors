<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, 'Administrateur')}">
<main>
	<h2 class="mb-4">Véhicules</h2>

	<div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 mb-4">
		<div th:each="vehicle : ${vehicles}" th:id="${'vehicleRow' + vehicle.id}" class="col" style="aspect-ratio: 5/6;">
			<div class="card h-100">
				<img src="#" class="card-img-top" style="aspect-ratio: 16/9;">
				<div class="card-body overflow-hidden">
					<h6 class="card-title" th:text="${vehicle.brand + ' ' + vehicle.model}"></h6>
					<p class="card-text" th:text="${vehicle.description}"></p>
				</div>
				<div class="card-footer p-1">
					<div class="row g-1">
						<div class="col-12 col-lg-6">
							<a th:href="'/admin/vehicles/edit/' + ${vehicle.id}" class="w-100 btn btn-sm btn-success">Modifier</a>
						</div>
						<div class="col-12 col-lg-6">
							<button type="button" class="w-100 btn btn-sm btn-danger" data-bs-toggle="modal" th:attr="data-bs-target=${'#deleteModal' + vehicle.id}">Supprimer</button>
						</div>
					</div>
				</div>
			</div>

			<div class="modal fade" th:id="${'deleteModal' + vehicle.id}" tabindex="-1" th:attr="aria-labelledby=${'deleteModalTitle' + vehicle.id}" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1 class="modal-title fs-5" th:id="${'deleteModalTitle' + vehicle.id}">Suppression du véhicule: [[${vehicle.brand} + ' ' + ${vehicle.model}]]</h1>
						</div>
						<div class="modal-body">
							<p>Êtes-vous sûr de vouloir supprimer ce véhicule ?</p>
							<p><strong>Cette action est irréversible !</strong></p>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
							<button type="button" class="btn btn-danger" data-bs-dismiss="modal" th:attr="data-delete-id=${vehicle.id}">Supprimer</button>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="mb-1 mt-3 p-2 alert alert-warning d-none" id="error" role="alert"></div>
	</div>

	<!-- TODO: card images -->
	<!-- TODO: vehicle search -->
	<!-- TODO: pages -->

	<a href="/admin/vehicles/add" class="btn btn-success">Nouveau véhicule</a>

	<script>
		const btn = $("[data-delete-id]");

		btn.on("click", (ev) => {
			const id = ev.target.getAttribute("data-delete-id");

			xhr("/api/admin/vehicles/delete", "POST", {
					id: id
				}, null,
				onSuccess = (req) => {
					if(!$("#error").hasClass("d-none"))
						$("#error").addClass("d-none");

					$("#vehicleRow" + id).remove();
				},
				onError = (req, json) => {
					$("#error").removeClass("d-none").text(json?.message ?? req.responseText);
				}
			);
		});
	</script>
</main>
</html>
