<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, 'Administrateur', ~{::script})}">
<main>
	<h2 class="mb-4">Dossiers</h2>

	<div class="d-flex flex-row">
		<div class="me-3">
			<p class="mb-1" id="sortHead">Trier par...</p>
			<div class="btn-group mb-4" role="group" aria-labelledby="sortHead">
				<input type="radio" class="btn-check" name="sort" id="sortNewest" autocomplete="off" checked>
				<label for="sortNewest" class="btn btn-sm btn-outline-success">Plus récent</label>

				<input type="radio" class="btn-check" name="sort" id="sortOldest" autocomplete="off">
				<label for="sortOldest" class="btn btn-sm btn-outline-success">Plus ancien</label>
			</div>
		</div>

		<div class="me-3">
			<p class="mb-1" id="filterHead">Filtrer...</p>
			<div class="btn-group mb-4" role="group" aria-labelledby="filterHead">
				<input type="radio" class="btn-check" name="filter" id="filterPending" autocomplete="off" checked>
				<label for="filterPending" class="btn btn-sm btn-outline-success">En cours</label>

				<input type="radio" class="btn-check" name="filter" id="filterApproved" autocomplete="off">
				<label for="filterApproved" class="btn btn-sm btn-outline-success">Validés</label>

				<input type="radio" class="btn-check" name="filter" id="filterDenied" autocomplete="off">
				<label for="filterDenied" class="btn btn-sm btn-outline-success">Refusés</label>

				<input type="radio" class="btn-check" name="filter" id="filterAny" autocomplete="off">
				<label for="filterAny" class="btn btn-sm btn-outline-success">Tous</label>
			</div>
		</div>
	</div>

	<p id="error" class="d-none">Aucun résultats</p>

	<div id="orderList">
		<div class="card mb-2" id="orderCard">
			<div class="card-body p-2">
				<div class="row">
					<div class="col-9 col-lg-3">
						<a class="card-text fw-semibold" data-title>Ford Focus</a>
					</div>
					<div class="col-3 col-lg-1 order-lg-last d-flex">
						<button class="btn btn-sm btn-success p-0 w-100" data-preview>Dossier</button>
					</div>
					<div class="col-6 col-lg-4">
						<p class="card-text fw-light">Déposé le <span data-date>DD/MM/YYYY HH:MM</span></p>
					</div>
					<div class="col-6 col-lg-4">
						<p class="card-text fw-light" data-status>En cours</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{comps/page-nav}"></div>

	<div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-xl">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="previewModalTitle">Dossier : </h1>
				</div>
				<div class="modal-body">
					<p class="card-text fw-light">Déposé le <span id="previewDate">DD/MM/YYYY HH:MM</span></p>
					<p class="card-text fw-light" id="previewStatus">En cours</p>
					<p class="card-text" id="previewRentDate"></p>
					<iframe src="" frameborder="0" width="100%" height="800" id="preview" class="mt-3"></iframe>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
				</div>
			</div>
		</div>
	</div>
</main>
<script>
	const modal = new bootstrap.Modal("#previewModal");
	const card = $("#orderCard").removeAttr("id");
	card.detach();

	let page = 0;
	let sort = 0;
	let filter = 0;
	let numPages = 0;

	$("#sortNewest").on("change", (ev) => {sort = 0; loadPage();});
	$("#sortOldest").on("change", (ev) => {sort = 1; loadPage();});

	$("#filterPending").on("change",  (ev) => {filter = 0; loadPage();});
	$("#filterApproved").on("change", (ev) => {filter = 1; loadPage();});
	$("#filterDenied").on("change",   (ev) => {filter = 2; loadPage();});
	$("#filterAny").on("change",      (ev) => {filter = 3; loadPage();});

	function formatDate(src)
	{
		const d = new Date(src);
		const date = d.toLocaleDateString("fr-FR");
		const time = d.toLocaleTimeString("fr-FR");

		return {date: date, time: time};
	}

	function loadPage()
	{
		xhr("/api/private/orders/list", "GET", null, {page: page, sort: sort, filter: filter, size: 16},
			onSuccess = (req, json) => {
				$("#orderList").children().remove();
				$("#error").addClass("d-none");

				numPages = json.page.totalPages;

				updatePageNav();

				json.content.forEach((o, idx) => {
					const name = `${o.vehicle.brand} ${o.vehicle.model}`;
					const c = card.clone();
					$("a", c).attr("href", `/vehicles/${o.vehicle.id}`);
					$("[data-title]", c).text(name);
					const {date, time} = formatDate(o.date);
					$("[data-date]", c).text(`${date}, à ${time}`);

					let status = "En cours";

					if(o.approvalDate)
					{
						const {date, time} = formatDate(o.approvalDate);

						if(o.approved)
							status = `Validé le ${date}, à ${time}`;
						else
							status = `Refusé le ${date}, à ${time}`;
					}

					$("[data-status]", c).text(status);

					$("[data-preview]", c).on("click", (ev) => {
						ev.preventDefault();

						$("#previewModalTitle").text(`Dossier : ${name}`);
						$("#previewDate").text(`${date}, à ${time}`);
						$("#previewStatus").text(status);
						$("#preview").attr("src", o.form.path);

						if(o.vehicle.forRenting)
						{
							const {date: start} = formatDate(o.startDate);
							const {date: end} = formatDate(o.endDate);

							$("#previewRentDate").text(`Pour location de ${start} à ${end}`);
						}
						else
							$("#previewRentDate").text("");

						modal.show();
					});

					$("#orderList").append(c);
				});

				if(json.content.length <= 0)
					$("#error").removeClass("d-none");
			},
			onError = (req, json) => {
				$("#error").removeClass("d-none").text(json?.message ?? req.responseText);
			}
		)
	}

	loadPage();
</script>
</html>
