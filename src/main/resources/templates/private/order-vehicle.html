<!DOCTYPE html>
<html th:replace="~{base::layout(~{::main}, 'Achat', _)}">
<main>
	<h2>Demande d'achat : <span class="fw-light">[[${vehicle.brand} + ' ' + ${vehicle.model}]]</span></h2>

	<form id="order">
		<div class="my-3">
			<label for="inputForm" class="form-label">Dossier d'achat</label>
			<input type="file" class="form-control" id="inputForm" accept=".pdf" required>
		</div>

		<div class="my-3 row" th:if="${vehicle.forRenting}">
			<div class="col-6">
				<label for="inputStart" class="form-label">Date de début</label>
				<input type="date" class="form-control" id="inputStart" required>
			</div>
	
			<div class="col-6">
				<label for="inputStart" class="form-label">Date de fin</label>
				<input type="date" class="form-control" id="inputEnd" required>
			</div>
		</div>

		<p><a href="/template-dossier.docx" class="text-decoration-none" style="font-size: 12px;" target="_blank">Télécharger la template</a></p>

		<button type="submit" class="btn btn-success" id="submit">Déposer</button>

		<iframe src="" frameborder="0" width="100%" height="500" id="preview" class="mt-3 d-none"></iframe>

		<div class="mb-1 mt-3 p-2 alert alert-warning d-none" id="error" role="alert"></div>
	</form>

	<script th:inline="javascript">
		const vehicleId = /*[[${vehicle.id}]]*/ 0;
		const renting = /*[[${vehicle.forRenting}]]*/ false;
		const btn = $("#submit");
		let files = null;

		$("#inputForm").on("change", async (ev) => {
			files = ev.currentTarget.files;

			if(files.length > 0)
			{
				$("#preview").removeClass("d-none");
				$("#preview").attr("src", URL.createObjectURL(files[0]));
			}
			else
				$("#preview").addClass("d-none");
		});

		$("#order").on("submit", (ev) => {
			ev.preventDefault();

			btn.attr("disabled", "");

			const data = renting ? {
				id: vehicleId,
				start: $("#inputStart").val(),
				end: $("#inputEnd").val()
			} : {id: vehicleId}

			xhr("/api/private/order", "POST", files, data,
				onSuccess = (req) => {
					location.replace("/private/");
				},
				onError = (req, json) => {
					displayAlert(false, json?.message ?? req.responseText, $("#error"));
					btn.removeAttr("disabled");
				}
			)
		});
	</script>
</main>
</html>
